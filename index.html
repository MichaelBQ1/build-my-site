
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вся Соль | Официальный сайт</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-lime: #00ffaa;
            --acid-orange: #ff4500;
            --fuchsia: #ff00ff;
            --bright-blue: #00d4ff;
        }
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            background: #000;
            overflow-x: hidden;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Unbounded', sans-serif;
        }
        
        /* Noise Effect */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Glitch Animation */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 3px) }
            40% { transform: translate(-3px, -3px) }
            60% { transform: translate(3px, 3px) }
            80% { transform: translate(3px, -3px) }
            100% { transform: translate(0) }
        }
        .glitch-hover:hover {
            animation: glitch 0.25s cubic-bezier(.25,.46,.45,.94) both infinite;
            text-shadow: 3px 0 var(--fuchsia), -3px 0 var(--neon-lime);
        }

        /* Neon Glows */
        .neon-text-lime { text-shadow: 0 0 15px rgba(0, 255, 170, 0.7); }
        .neon-text-fuchsia { text-shadow: 0 0 15px rgba(255, 0, 255, 0.7); }
        .neon-text-blue { text-shadow: 0 0 15px rgba(0, 212, 255, 0.7); }
        .neon-border-lime { box-shadow: 0 0 20px rgba(0, 255, 170, 0.4); border-color: var(--neon-lime); }
        
        /* Pulse Animation */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 170, 0.4); }
            50% { box-shadow: 0 0 50px rgba(0, 255, 170, 0.9); }
        }
        .animate-pulse-glow { animation: pulse-glow 1.5s infinite; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #05000a; }
        ::-webkit-scrollbar-thumb { background: #1a0033; border-radius: 10px; border: 2px solid #05000a; }
        ::-webkit-scrollbar-thumb:hover { background: var(--fuchsia); }

        .skewed-bg { transform: skewY(-4deg); }
        .unskew { transform: skewY(4deg); }

        /* Visualizer Bars */
        @keyframes bar-grow {
            0%, 100% { height: 4px; }
            50% { height: 20px; }
        }
        .visualizer-bar { animation: bar-grow var(--duration) ease-in-out infinite; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body class="bg-black text-zinc-100 overflow-x-hidden">
    <div class="noise-overlay"></div>
    <div id="root"></div>
</body>
</html>
